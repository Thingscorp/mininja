<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Mininja mark">
  <!-- First-party 5×3 chip silhouette (CONSTRUCTION). Tint via currentColor. Not a third-party mark copy. -->
  <g fill="currentColor">
    <!-- hood: ▚████ as triangle + four rects -->
    <polygon points="1.8,3 4,3 4,5.2"/>
    <rect x="4" y="3" width="2.1" height="2.2"/>
    <rect x="6.1" y="3" width="2.1" height="2.2"/>
    <rect x="8.2" y="3" width="2.1" height="2.2"/>
    <rect x="10.3" y="3" width="2.1" height="2.2"/>
    <!-- mid body ██ + eyes ●● -->
    <rect x="1.8" y="6" width="2.1" height="2.2"/>
    <rect x="3.9" y="6" width="2.1" height="2.2"/>
    <circle cx="8.5" cy="7.1" r="0.95"/>
    <circle cx="11.4" cy="7.1" r="0.95"/>
    <!-- feet ▀▀▀▀▀ -->
    <rect x="1.8" y="10" width="2.15" height="1.6"/>
    <rect x="4.05" y="10" width="2.15" height="1.6"/>
    <rect x="6.3" y="10" width="2.15" height="1.6"/>
    <rect x="8.55" y="10" width="2.15" height="1.6"/>
    <rect x="10.8" y="10" width="2.15" height="1.6"/>
  </g>
</svg>
